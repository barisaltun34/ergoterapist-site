<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ergoterapist Cansu Altun | Pek Yakında</title>
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f172a;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Arka Plan Glow Efektleri */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 400px;
      height: 400px;
      background: #a855f7;
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 450px;
      height: 450px;
      background: #3b82f6;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    /* Glassmorphism Kart */
    .container {
      position: relative;
      z-index: 1;
      max-width: 750px;
      width: 90%;
      padding: 3.5rem 2.5rem;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 1.2s ease-out;
    }

    /* Rozet */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 100px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #d8b4fe;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #ec4899;
      border-radius: 50%;
      box-shadow: 0 0 10px #ec4899;
      animation: blink 1.5s infinite;
    }

    /* Başlık */
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Açıklama */
    p {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--text-muted);
      line-height: 1.7;
      font-weight: 400;
      max-width: 600px;
      margin: 0 auto 2.5rem auto;
    }

    /* İmza / Alt Bilgi */
    .footer-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.5rem;
    }

    /* Animasyonlar */
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(30px, -20px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      Yapım Aşamasında
    </div>
    
    <h1>Dünyanın En İyi Uzman Ergoterapistinin Sayfasına Hoş Geldiniz!</h1>
    
    <p>
      Sitemiz şu anda sevgi, özen ve büyük bir heyecanla hazırlanıyor. 
      Çok kısa bir süre içerisinde en güncel çalışmalarımız ve hizmetlerimizle sizlerle birlikte olacağız.
    </p>

    <div class="footer-title">
      ✨ Ergoterapist Cansu Altun
    </div>
  </main>

</body>
</html>
